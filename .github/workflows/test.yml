name: FSPS CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch: # Allow manual triggering from the GitHub Actions tab

jobs:
  # ------------------------------------------------------------------
  # Native Environments
  # ------------------------------------------------------------------
  native-tests:
    name: Native Tests (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux + GFortran (standard target configuration)
          - os: ubuntu-latest
            compiler: gfortran
            fortran_args: "-ffpe-summary=invalid,zero,overflow"
            linker_args: ""
            # Enable coverage for GFortran builds on Linux only
            build_args: "-Db_coverage=true"
            coverage: true
            # gcovr only required for coverage reports
            install_cmd: |
              sudo apt-get update && sudo apt-get install -y gfortran meson ninja-build gcovr
          
          # Linux + LLVM Flang (experimental)
          # This is currently pinned to Flang-20, consider bumping in the future.
          - os: ubuntu-latest
            compiler: flang-20
            fortran_args: ""
            linker_args: ""
            build_args: ""
            coverage: false
            install_cmd: |
              sudo apt-get update && sudo apt-get install -y flang-20 ninja-build python3-pip
              sudo apt-get remove -y meson || true
              sudo pip3 install --break-system-packages meson

          # MacOS + GFortran
          - os: macos-latest
            compiler: gfortran-homebrew
            fortran_args: "-ffpe-summary=invalid,zero,overflow"
            linker_args: ""
            build_args: ""
            coverage: false
            install_cmd: |
              brew install gcc meson ninja

    env:
      FC: ${{ matrix.compiler }}
      FFLAGS: ${{ matrix.fortran_args }}
      LDFLAGS: ${{ matrix.linker_args }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Dependencies
      run: ${{ matrix.install_cmd }}
    
    - name: Set Compiler Path (MacOS Only)
      if: matrix.os == 'macos-latest'
      run: |
        # Ask Homebrew for the gcc package lives
        GCC_PREFIX=$(brew --prefix gcc)
        # Find the gfortran binary inside that prefix (e.g., bin/gfortran-14)
        # We sort by version (-V) and take the last one to ensure we get the latest
        GFORTRAN_BIN=$(ls $GCC_PREFIX/bin/gfortran-* | sort -V | tail -n1)
        
        echo "Found GFortran at: $GFORTRAN_BIN"
        
        # Export this path to $FC for all future steps
        echo "FC=$GFORTRAN_BIN" >> $GITHUB_ENV

    - name: Verify Compiler Version
      run: $FC --version

    - name: Configure Build
      # Coverage build requires extra flags
      run: meson setup build ${{ matrix.build_args }}

    - name: Compile FSPS
      run: meson compile -C build

    - name: Run Unit Tests
      # Verbose output for CI logs
      run: meson test -v -C build --suite unit
    
    - name: Run Regression Tests
      run: meson test -v -C build --suite regression --print-errorlogs
    
    - name: Generate Coverage Report
      if: matrix.coverage == true
      run: ninja -C build coverage-xml

    - name: Upload Coverage Report to Codecov.io
      if: matrix.coverage == true
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./build/meson-logs/coverage.xml
        fail_ci_if_error: true

  # ------------------------------------------------------------------
  # Containerized Environments
  # ------------------------------------------------------------------
  container-tests:
    name: Container Tests (${{ matrix.compiler.name }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # NVIDIA HPC SDK (Rocky Linux)
          - compiler: { name: 'nvfortran', fc: 'nvfortran', cc: 'nvc' }
            fortran_args: "-acc=multicore -Minfo=accel"
            linker_args: "-acc=multicore"
            build_args: ""
            image: nvcr.io/nvidia/nvhpc:26.1-devel-cuda_multi-rockylinux9
            env_cmd: ""
            install_cmd: |
              dnf update --assumeyes --refresh
              dnf install --assumeyes python3-pip
              pip3 install meson ninja
          
          # Intel oneAPI HPC Toolkit (Ubuntu)
          - compiler: { name: 'ifx', fc: 'ifx', cc: 'icx' }
            # -fp-model=precise prevents aggressive math reordering that breaks 1e-5 tolerances
            fortran_args: "-fp-model=precise" 
            linker_args: ""
            build_args: ""
            image: intel/oneapi-hpckit:devel-ubuntu24.04
            env_cmd: "source /opt/intel/oneapi/setvars.sh"
            install_cmd: |
              apt-get update -y
              apt-get install -y python3-pip
              pip3 install --break-system-packages meson ninja
    
    container:
      image: ${{ matrix.image }}
    
    env:
      FC: ${{ matrix.compiler.fc }}
      CC: ${{ matrix.compiler.cc }}
      FFLAGS: ${{ matrix.fortran_args }}
      LDFLAGS: ${{ matrix.linker_args }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Dependencies
      run: ${{ matrix.install_cmd }}

    - name: Verify Compiler Version
      # Sourcing the environment is required before every step for Intel
      run: |
        ${{ matrix.env_cmd }}
        $FC --version

    - name: Configure Build
      run: |
        ${{ matrix.env_cmd }}
        meson setup build ${{ matrix.build_args }}

    - name: Compile FSPS
      run: |
        ${{ matrix.env_cmd }}
        meson compile -C build

    - name: Run Unit Tests
      run: |
        ${{ matrix.env_cmd }}
        meson test -v -C build --suite unit

    - name: Run Regression Tests
      run: |
        ${{ matrix.env_cmd }}
        meson test -v -C build --suite regression --print-errorlogs