name: FSPS Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux + GFortran (standard target configuration)
          - os: ubuntu-latest
            compiler: gfortran
            coverage: true
            # gcovr only required for coverage reports
            install_cmd: |
              sudo apt-get update && sudo apt-get install -y gfortran meson ninja-build gcovr
          
          # Linux + LLVM Flang (experimental)
          # This is currently pinned to Flang-20, consider bumping in the future.
          - os: ubuntu-latest
            compiler: flang-20
            coverage: false
            install_cmd: |
              sudo apt-get update && sudo apt-get install -y flang-20 ninja-build python3-pip
              sudo apt-get remove -y meson || true
              sudo pip3 install --break-system-packages meson

          # MacOS + GFortran
          - os: macos-latest
            compiler: gfortran-homebrew
            coverage: false
            install_cmd: |
              brew install gcc meson ninja

    env:
      FSPS_DATA_HOME: ${{ github.workspace }}
      FC: ${{ matrix.compiler }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Dependencies
      run: ${{ matrix.install_cmd }}
    
    - name: Set Compiler Path (MacOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Ask Homebrew for the gcc package lives
        GCC_PREFIX=$(brew --prefix gcc)
        # Find the gfortran binary inside that prefix (e.g., bin/gfortran-14)
        # We sort by version (-V) and take the last one to ensure we get the latest
        GFORTRAN_BIN=$(ls $GCC_PREFIX/bin/gfortran-* | sort -V | tail -n1)
        
        echo "Found GFortran at: $GFORTRAN_BIN"
        
        # Export this path to $FC for all future steps
        echo "FC=$GFORTRAN_BIN" >> $GITHUB_ENV

    - name: Verify Compiler Version
      run: $FC --version

    - name: Configure FSPS (Meson)
      # Coverage build requires extra flags
      run: |
        if [[ "${{ matrix.coverage }}" == true ]]; then
          meson setup build -Db_coverage=true
        else
          meson setup build
        fi

    - name: Compile FSPS and Unit Tests
      run: meson compile -C build

    - name: Run Unit Tests
      # Verbose output for CI logs
      run: meson test -v -C build --suite unit
    
    - name: Generate Coverage Report
      if: matrix.coverage == true
      run: ninja -C build coverage-xml

    - name: Upload Coverage Report to Codecov.io
      if: matrix.coverage == true
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./build/meson-logs/coverage.xml
        fail_ci_if_error: true

  regression-tests:
    name: Regression Tests (Meson suite)
    runs-on: ubuntu-latest
    # needs: unit-tests
    
    env:
      FSPS_DATA_HOME: ${{ github.workspace }}
      # Set global relative tolerance here
      FSPS_TEST_RTOL: 1.0E-5
      # Silence underflows
      FFLAGS: "-ffpe-summary=invalid,zero,overflow"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran meson ninja-build

    - name: Configure FSPS (Meson)
      run: meson setup build

    - name: Compile FSPS
      run: meson compile -C build

    - name: Run Regression Suite
      run: meson test -v -C build --suite regression --print-errorlogs