name: FSPS Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux + GFortran (standard target configuration)
          - os: ubuntu-latest
            compiler: gfortran
            install_cmd: |
              sudo apt-get update && sudo apt-get install -y gfortran meson ninja-build
          
          # Linux + LLVM Flang (experimental)
          - os: ubuntu-latest
            compiler: flang
            install_cmd: |
              sudo apt-get update && sudo apt-get install -y flang meson ninja-build

          # MacOS + GFortran
          - os: macos-latest
            compiler: gfortran
            install_cmd: brew install gcc meson ninja

    env:
      FSPS_DATA_HOME: ${{ github.workspace }}
      FC: ${{ matrix.compiler }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Dependencies
      run: ${{ matrix.install_cmd }}

    - name: Verify Compiler Version
      run: $FC --version

    - name: Configure FSPS (Meson)
      run: meson setup build

    - name: Compile FSPS and Unit Tests
      run: meson compile -C build

    - name: Run Unit Tests
      # Verbose output for CI logs
      run: meson test -v -C build

  regression-tests:
    name: Regression Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: unit-tests
    
    env:
      FSPS_DATA_HOME: ${{ github.workspace }}
      # Set global relative tolerance here
      FSPS_TEST_RTOL: 1.0E-5
      # Silence underflows
      FFLAGS: "-ffpe-summary=invalid,zero,overflow"

    strategy:
      fail-fast: false
      matrix:
        include:
          # Define the configurations to test.
          # 'opts': The library options passed to test_runner.
          # 'ref_suffix': The suffix of the reference file in tests/data/
          
          # 1. Standard (Default)
          - name: MILES + MIST (default)
            opts: "--isoc mist --spec miles"
            ref_suffix: "MILES-1_MIST-1"

          # 2. BaSeL+Padova
          - name: BaSEL + Padova
            opts: "--isoc pdva --spec basel"
            ref_suffix: "MILES-0_MIST-0_BASEL-1_PADOVA-1"

          # 3. Dust Model (THEMIS)
          - name: THEMIS (dust)
            opts: "--isoc mist --spec miles --dust themis"
            ref_suffix: "MILES-1_MIST-1_THEMIS-1_DL07-0"

          # 4. C3K
          - name: C3K + MIST
            opts: "--isoc mist --spec c3k_afe+0.0"
            ref_suffix: "MILES-0_C3K-1_MIST-1"

          # 5. BPASS (Different logic path)
          - name: BPASS
            opts: "--isoc bpss"
            ref_suffix: "MIST-0_BPASS-1"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran meson ninja-build

    - name: Configure FSPS (Meson)
      run: meson setup build

    - name: Compile FSPS and Regression Test
      run: meson compile -C build

    - name: Run Regression Test
      run: |
        ./build/test_runner tests/data/sps_ref_${{ matrix.ref_suffix }}.bin ${{ matrix.opts }}