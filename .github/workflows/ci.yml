name: FSPS CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch: # Allow manual triggering from the GitHub Actions tab

jobs:
  # ------------------------------------------------------------------
  # Native Environments
  # ------------------------------------------------------------------
  native-tests:
    name: Native Tests (${{ matrix.os }}, ${{ matrix.compiler }}${{ matrix.variant }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux + GFortran (standard target configuration)
          - os: ubuntu-latest
            compiler: gfortran
            fflags: "-ffpe-summary=invalid,zero,overflow"
            # Enable coverage for GFortran builds on Linux only
            build_args: "-Db_coverage=true"
            coverage: true
            # gcovr only required for coverage reports
            install_cmd: |
              sudo apt-get update && sudo apt-get install -y gfortran meson ninja-build gcovr

          # Linux + GFortran (OpenMP)
          - os: ubuntu-latest
            compiler: gfortran
            variant: " (OpenMP)"
            fflags: "-ffpe-summary=invalid,zero,overflow"
            # Use Meson-managed OpenMP detection/flags
            build_args: "-Denable_openmp=true"
            coverage: false
            install_cmd: |
              sudo apt-get update && sudo apt-get install -y gfortran meson ninja-build
          
          # Linux + LLVM Flang (experimental)
          # This is currently pinned to Flang-20, consider bumping in the future.
          - os: ubuntu-latest
            compiler: flang-20
            fflags: ""
            build_args: ""
            coverage: false
            install_cmd: |
              sudo apt-get update && sudo apt-get install -y flang-20 ninja-build python3-pip
              sudo apt-get remove -y meson || true
              sudo pip3 install --break-system-packages meson

          # MacOS + GFortran
          - os: macos-latest
            compiler: gfortran-homebrew
            fflags: "-ffpe-summary=invalid,zero,overflow"
            build_args: ""
            coverage: false
            install_cmd: |
              brew install gcc meson ninja

    env:
      FC: "ccache ${{ matrix.compiler }}"
      FFLAGS: ${{ matrix.fflags }}
      OMP_NUM_THREADS: 2

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    
    - name: Setup Compiler Cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        # Create a unique cache bucket for each matrix permutation
        key: ${{ matrix.os }}-${{ matrix.compiler }}${{ matrix.variant }}
        max-size: '500M'

    - name: Install Dependencies
      run: ${{ matrix.install_cmd }}
    
    - name: Set Compiler Path (MacOS Only)
      if: matrix.os == 'macos-latest'
      run: |
        # Ask Homebrew for the gcc package lives
        GCC_PREFIX=$(brew --prefix gcc)
        # Find the gfortran binary inside that prefix (e.g., bin/gfortran-14)
        # We sort by version (-V) and take the last one to ensure we get the latest
        GFORTRAN_BIN=$(ls $GCC_PREFIX/bin/gfortran-* | sort -V | tail -n1)
        
        echo "Found GFortran at: $GFORTRAN_BIN"
        
        # Export this path to $FC for all future steps
        echo "FC=ccache $GFORTRAN_BIN" >> $GITHUB_ENV

    - name: Verify Compiler Version
      run: $FC --version

    - name: Configure Build
      # Coverage build requires extra flags
      run: meson setup build ${{ matrix.build_args }}

    - name: Compile FSPS
      run: meson compile -C build

    - name: Run Unit Tests
      # Verbose output for CI logs
      run: meson test -v -C build --suite unit
    
    - name: Run Regression Tests
      run: meson test -v -C build --suite regression --print-errorlogs
    
    - name: Generate Coverage Report
      if: matrix.coverage == true
      run: ninja -C build coverage-xml

    - name: Upload Coverage Report to Codecov.io
      if: matrix.coverage == true
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./build/meson-logs/coverage.xml
        fail_ci_if_error: true

  # ------------------------------------------------------------------
  # Containerized Environments
  # ------------------------------------------------------------------
  container-tests:
    name: Container Tests (${{ matrix.compiler.name }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # NVIDIA HPC SDK (Rocky Linux)
          - compiler: { name: 'nvfortran', fc: 'nvfortran', cc: 'nvc' }
            # Keep compiler diagnostics in CI logs while OpenACC targeting is
            # configured through Meson options.
            fflags: "-Minfo=accel"
            build_args: "-Daccel=multicore"
            image: nvcr.io/nvidia/nvhpc:26.1-devel-cuda_multi-rockylinux9
            install_cmd: |
              dnf update --assumeyes --refresh
              dnf install --assumeyes python3-pip
              pip3 install meson ninja
          
          # # Intel oneAPI HPC Toolkit (Ubuntu)
          # - compiler: { name: 'ifx', fc: 'ifx', cc: 'icx' }
          #   # -fp-model=precise prevents aggressive math reordering that breaks 1e-5 tolerances
          #   fflags: "-fp-model=precise"
          #   build_args: ""
          #   image: intel/oneapi-hpckit:devel-ubuntu22.04
          #   install_cmd: |
          #     apt-get update -y
          #     apt-get install -y python3-pip
          #     PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install meson ninja
    
    container:
      image: ${{ matrix.image }}
    
    env:
      FC: ${{ matrix.compiler.fc }}
      CC: ${{ matrix.compiler.cc }}
      FFLAGS: ${{ matrix.fflags }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Dependencies
      run: ${{ matrix.install_cmd }}

    - name: Verify Compiler Version
      run: $FC --version

    - name: Configure Build
      run: meson setup build ${{ matrix.build_args }}

    - name: Compile FSPS
      run: meson compile -C build

    - name: Run Unit Tests
      run: meson test -v -C build --suite unit

    - name: Run Regression Tests
      run: meson test -v -C build --suite regression --print-errorlogs

  # ------------------------------------------------------------------
  # Packaging Tests
  # ------------------------------------------------------------------
  build-rpm:
    name: Build Fedora RPM
    runs-on: ubuntu-latest

    # Run the job inside a pristine Fedora container
    container:
      image: fedora:latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          set-safe-directory: true
      
      - name: Install RPM Build Dependencies
        run: |
          dnf update -y
          # Install core packaging tools and git
          dnf install -y rpm-build rpmdevtools git
          
          # Use dnf builddep to automatically read the .spec file 
          # and install gcc-gfortran, meson, and ninja-build
          dnf builddep -y packaging/fsps.spec
      
      - name: Prepare RPM Workspace
        run: |
          # Create ~/rpmbuild/SOURCES, SPECS, RPMS, etc.
          rpmdev-setuptree
          
          # Copy the spec file into the workspace
          cp packaging/fsps.spec ~/rpmbuild/SPECS/
      
      - name: Generate Source Tarball
        run: |
          # Extract the version number directly from the spec file
          VERSION=$(grep -i '^Version:' packaging/fsps.spec | awk '{print $2}')
          echo "Packaging version: $VERSION"
          
          # Git archive requires the directory to be a safe repository
          git config --global --add safe.directory $GITHUB_WORKSPACE
          
          # Create the tarball that rpmbuild expects
          git archive --format=tar.gz --prefix=fsps-$VERSION/ -o ~/rpmbuild/SOURCES/fsps-$VERSION.tar.gz HEAD
      
      - name: Build RPMs
        run: |
          # Build binary and source RPMs (-ba)
          rpmbuild -ba ~/rpmbuild/SPECS/fsps.spec
      
      - name: Verify Installation (Smoke Test)
        run: |
          # Actually install the newly built RPMs into the container
          dnf install -y ~/rpmbuild/RPMS/x86_64/*.rpm
          
          # Verify the library was installed and the linker can find it
          ldconfig -p | grep libfsps
      
      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fedora-latest-rpms
          path: |
            ~/rpmbuild/RPMS/*/*.rpm
            ~/rpmbuild/SRPMS/*.rpm
          retention-days: 7
