# Per-change CI: every push to develop/master and every pull request.
#
# Breadth over compilers and hardware, each job running the full unit + regression suites
# (physics oracles, regression references, the 34-case parameterized matrix), plus two sanitizer
# jobs aimed at memory errors and thread safety. Heavier runs (long stress tests, newest
# compilers, GPUs) are in nightly.yml, packaging in packaging.yml. See doc/CI.md.

name: CI

on:
  push:
    branches: [master, develop]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'tools/**'
      - 'CITATION.bib'
      - 'LICENSE.md'
      - '.github/workflows/nightly.yml'
      - '.github/workflows/packaging.yml'
  pull_request:
    branches: [master, develop]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'tools/**'
      - 'CITATION.bib'
      - 'LICENSE.md'
      - '.github/workflows/nightly.yml'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:

# A newer push to the same pull request supersedes the running one
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Reference build: the only job that checks out the 600 MB C3K library; coverage
          - name: gfortran / Linux x86-64 / coverage
            os: ubuntu-24.04
            install: apt-gfortran
            full_data: true
            coverage: true
            setup_args: -Db_coverage=true

          - name: gfortran / Linux arm64
            os: ubuntu-24.04-arm
            install: apt-gfortran

          - name: gfortran / macOS arm64
            os: macos-15
            install: setup-fortran
            toolchain: gcc
            version: 14

          - name: LLVM flang / Linux x86-64
            os: ubuntu-24.04
            install: apt-flang

          - name: Intel ifx / Linux x86-64
            os: ubuntu-24.04
            install: setup-fortran
            toolchain: intel
            version: '2026.1'

          # OpenACC directive paths, executed on host cores (hosted runners have no GPU)
          - name: nvfortran / OpenACC multicore / Linux x86-64
            os: ubuntu-24.04
            install: setup-fortran
            toolchain: nvidia-hpc
            version: '26.1'
            setup_args: -Daccel=multicore
            fflags: -Minfo=accel

    env:
      FFLAGS: ${{ matrix.fflags }}

    steps:
      - name: Checkout (without the C3K library)
        if: ${{ !matrix.full_data }}
        uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/spectra/C3K/

      - name: Checkout (full data)
        if: ${{ matrix.full_data }}
        uses: actions/checkout@v6

      - name: Install gfortran (apt)
        if: matrix.install == 'apt-gfortran'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gfortran ccache
          echo "FC=ccache gfortran" >> "$GITHUB_ENV"
          echo "CC=ccache gcc" >> "$GITHUB_ENV"

      - name: Install LLVM flang (apt)
        if: matrix.install == 'apt-flang'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flang-20 clang-20 ccache
          echo "FC=ccache flang-20" >> "$GITHUB_ENV"
          echo "CC=ccache clang-20" >> "$GITHUB_ENV"

      - name: Install ${{ matrix.toolchain }} ${{ matrix.version }}
        if: matrix.install == 'setup-fortran'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.toolchain }}
          version: ${{ matrix.version }}

      - name: Cache compiler output
        if: startsWith(matrix.install, 'apt-')
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.install }}
          max-size: 200M

      - name: Install Meson, Ninja and gcovr
        run: |
          pipx install meson
          pipx install ninja
          if [ "${{ matrix.coverage }}" = "true" ]; then pipx install gcovr; fi

      - name: Toolchain versions
        run: |
          $FC --version
          meson --version

      - name: Configure
        run: meson setup build --buildtype=release ${{ matrix.setup_args }}

      - name: Build
        run: meson compile -C build

      - name: Unit and regression tests
        run: meson test -C build --suite unit --suite regression --print-errorlogs

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: testlog-${{ strategy.job-index }}
          path: build/meson-logs/
          retention-days: 7

      - name: Coverage report
        if: matrix.coverage
        run: ninja -C build coverage-xml

      # Pull requests from forks have no Codecov token; the push build reports their coverage
      - name: Upload coverage to Codecov
        if: matrix.coverage && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/meson-logs/coverage.xml
          fail_ci_if_error: true

  # Each sanitizer runs the stress phases it is suited to: AddressSanitizer the leak and
  # reallocation phases (A, C), ThreadSanitizer the concurrent compute and setup/release phases
  # (B, D; the test harness makes its threads with OpenMP). Nightly runs every phase for longer.
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer + UBSan / stress A, C
            setup_args: -Db_sanitize=address,undefined
            stress_env: FSPS_STRESS_PHASES=AC FSPS_STRESS_ITERS=3

          - name: ThreadSanitizer / stress B, D
            setup_args: -Db_sanitize=thread -Denable_openmp=true
            stress_env: FSPS_STRESS_PHASES=BD FSPS_STRESS_ITERS=4
            tsan: true

    env:
      FFLAGS: -ffpe-summary=invalid,zero,overflow
      OMP_NUM_THREADS: 4
      FC: ccache gfortran
      CC: ccache gcc

    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/spectra/C3K/

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gfortran ccache
          pipx install meson
          pipx install ninja

      - name: Cache compiler output
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitizer-${{ strategy.job-index }}
          max-size: 200M

      - name: Configure
        run: meson setup build -Denable_stress_testing=true ${{ matrix.setup_args }}

      - name: Build
        run: meson compile -C build

      - name: Unit tests
        run: meson test -C build --suite unit --print-errorlogs

      - name: Stress tests
        run: |
          if [ "${{ matrix.tsan }}" = "true" ]; then
            export TSAN_OPTIONS="suppressions=$PWD/tests/tsan.supp halt_on_error=1 second_deadlock_stack=1"
          fi
          env ${{ matrix.stress_env }} meson test -C build --suite stress --print-errorlogs

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sanitizer-log-${{ strategy.job-index }}
          path: build/meson-logs/
          retention-days: 7
